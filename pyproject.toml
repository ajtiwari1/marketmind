[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketmind-langfuse-utils"
version = "0.1.0"
description = "Reusable Langfuse instrumentation utilities for MarketMind applications"
requires-python = ">=3.11,<4"
dependencies = ["langfuse>=5,<6"]

[tool.setuptools.packages.find]
include = ["libs", "libs.*"]
